<div class="login-overlay" [class.hidden]="appState.loggedIn()">
  <div class="login-card">
    <div class="login-logo">
      <span class="material-symbols-outlined" style="font-size:28px;color:#fff;">mail</span>
    </div>
    <h1>UXReach</h1>
    <p>Invite Email Agent</p>

    <!-- GIS renders the real Google button here -->
    <div #googleBtn id="google-btn" class="google-btn-wrapper"></div>

    @if (appState.loginError()) {
      <div class="login-error">
        <span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;">error</span>
        {{ appState.loginError() }}
      </div>
    }
  </div>
</div>
