<!-- Header -->
<div class="sidebar-header">
  <div class="sidebar-logo">UX</div>
  <div>
    <div class="sidebar-brand">UXReach</div>
    <div class="sidebar-version">v2.0 POC</div>
  </div>
</div>

<!-- Navigation -->
<nav class="sidebar-nav">
  <div class="nav-section-label">Main</div>
  @for (item of mainNavItems; track item.route) {
    <a
      class="nav-item"
      [routerLink]="item.route"
      routerLinkActive="active"
    >
      <span class="material-symbols-outlined nav-icon">{{ item.icon }}</span>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  }

</nav>

<!-- Admin nav (admin role only) -->
@if (appState.userRole() === 'admin') {
  <nav class="sidebar-nav" style="margin-top:8px;">
    <div class="nav-section-label">Admin</div>
    <a class="nav-item" routerLink="/admin" routerLinkActive="active">
      <span class="material-symbols-outlined nav-icon">manage_accounts</span>
      <span class="nav-label">Users</span>
    </a>
  </nav>
}
